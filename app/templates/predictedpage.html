{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header">Prediction Config</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Choose Model</label>
                    <select id="prediction-model-select" class="form-select">
                        <option value="">Loading models...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Choose Data</label>
                    <select id="prediction-dataset-select" class="form-select">
                        <option value="">Loading datasets...</option>
                    </select>
                </div>

                <button id="start-prediction-btn" class="btn btn-success w-100" type="button">
                    Start Prediction
                </button>
            </div>
        </div>
    </div>

    <div class="col-lg-7">
        <div class="card">
            <div class="card-header">Predicted List</div>
            <div class="card-body table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Model</th>
                            <th>Dataset</th>
                            <th>Status</th>
                            <th>Time</th>
                            <th width="260">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="prediction-table-body">
                        <tr>
                            <td colspan="6" class="text-center text-muted">Loading predictions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="viewPredictionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Prediction Result</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <pre id="prediction-result-box" class="log-box" style="min-height: 320px;">No result yet.</pre>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editPredictionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="edit-prediction-form" method="post" action="javascript:void(0);">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Prediction Record</h5>
                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-prediction-id">

                    <div class="mb-3">
                        <label class="form-label">Note</label>
                        <textarea id="edit-prediction-note" class="form-control" rows="4"></textarea>
                    </div>

                    <div id="edit-prediction-message" class="small"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
