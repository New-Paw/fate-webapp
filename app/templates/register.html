{% extends "base.html" %}

{% block auth_content %}
<div class="card shadow-sm">
    <div class="card-header">
        Register
    </div>

    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register">
            <h6 class="mb-3">WebApp Account</h6>

            <div class="mb-3">
                <label class="form-label">Account</label>
                <input name="account" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input name="confirm_password" type="password" class="form-control" required>
            </div>

            <h6 class="mb-3">Server Login Binding</h6>

            <div class="mb-3">
                <label class="form-label">Server Username</label>
                <input name="server_username" class="form-control" placeholder="Example: xjiangp00" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Server Password</label>
                <input name="server_password" type="password" class="form-control" required>
            </div>

            <button class="btn btn-success w-100" type="submit">Register</button>
        </form>

        <div class="mt-3 text-center">
            <a href="/login">Already have an account? Login</a>
        </div>
    </div>
</div>
{% endblock %}
