{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <div class="col-lg-5">
        <div class="card mb-4">
            <div class="card-header">Choose Data Set</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Training Data Set</label>
                    <select id="training-dataset-select" class="form-select">
                        <option value="">Loading datasets...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Algorithm</label>
                    <select id="training-algorithm-select" class="form-select">
                        <option>Homo Logistic Regression</option>
                    </select>
                </div>

                <button
                    id="open-params-modal-btn"
                    class="btn btn-outline-primary w-100"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#trainingParamsModal"
                >
                    Choose Input Parameters
                </button>
            </div>
        </div>
    </div>

    <div class="col-lg-7">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Request of Logs</span>
                <button id="request-logs-btn" class="btn btn-outline-primary btn-sm" type="button">
                    Request Logs
                </button>
            </div>

            <div class="card-body">
                <pre id="training-log-box" class="log-box">No logs yet.</pre>
            </div>
        </div>

        <div class="text-end mt-4">
            <button id="create-training-btn" class="btn btn-primary btn-lg" type="button">
                Create Training
            </button>
        </div>
    </div>
</div>

<div class="modal fade" id="trainingParamsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Training Parameters</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Learning Rate</label>
                    <input id="param-learning-rate" type="number" step="0.001" class="form-control" value="0.1">
                </div>

                <div class="mb-3">
                    <label class="form-label">Epochs</label>
                    <input id="param-epochs" type="number" class="form-control" value="10">
                </div>

                <div class="mb-3">
                    <label class="form-label">Batch Size</label>
                    <input id="param-batch-size" type="number" class="form-control" value="32">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Close</button>
                <button class="btn btn-primary" type="button" data-bs-dismiss="modal">Confirm</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
